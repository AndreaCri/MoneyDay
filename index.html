<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MoneyDay</title>
<meta name="description" content="Spese, conti, spese fisse e previsioni, tutto sul tuo telefono.">
<meta name="theme-color" content="#F2F2F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MoneyDay">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#E3E3E8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif}
a{color:#007AFF}a:hover{color:#0062CC}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
[data-theme]{--bg:#F2F2F7;--card:#FFFFFF;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.08);--sep:rgba(60,60,67,.13);--label:#0B0B0F;--label2:rgba(60,60,67,.66);--label3:rgba(60,60,67,.45);--blue:#007AFF;--inc:#1E9E47;--incf:#34C759;--exp:#E5372C;--expf:#FF3B30;--hero:linear-gradient(140deg,#4F46E5 0%,#2563EB 45%,#0EA5E9 100%);--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(15,23,42,.06);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;--fontd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;--fontr:ui-rounded,"SF Pro Rounded",-apple-system,"Inter",sans-serif}
[data-theme="dark"]{--bg:#000;--card:#1C1C1E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.14);--sep:rgba(84,84,88,.55);--label:#fff;--label2:rgba(235,235,245,.66);--label3:rgba(235,235,245,.4);--blue:#0A84FF;--inc:#30D158;--incf:#30D158;--exp:#FF453A;--expf:#FF453A;--hero:linear-gradient(140deg,#3730A3 0%,#1D4ED8 50%,#0284C7 100%);--shadow:none;color-scheme:dark}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.4}}
@keyframes fadeIn{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes blink{50%{opacity:0}}
html,body{margin:0;height:100%;}
html.standalone,html.standalone body{height:100vh}
html,body{background:#F2F2F7;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;touch-action:manipulation}
#root{height:100%}
*::-webkit-scrollbar{display:none}
input,select{outline:none}
.key:active{background:var(--fill)!important}
.boot{position:fixed;inset:0;display:grid;place-items:center;color:rgba(60,60,67,.6);font-size:15px;text-align:center;padding:24px}
</style>
</head>
<body>
<script>
// App aggiunta alla Home: usa tutta l'altezza dello schermo (evita lo spazio vuoto in basso su iPhone)
if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) {
  document.documentElement.style.setProperty('--app-h', '100vh');
  document.documentElement.classList.add('standalone');
}
</script>
<div id="root"><div class="boot">Caricamento…</div></div>

<template id="app-template">
<div data-theme="{{ theme }}" style="position:fixed;top:0;left:0;right:0;height:var(--app-h,100%);margin:0 auto;max-width:520px;z-index:1;background:var(--bg);color:var(--label);font-family:var(--font);font-size:16px;line-height:1.4;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow:hidden">

<template sc-if value="{{ isSetup }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 40px)">
  <section style="position:relative;border-radius:26px;padding:22px 20px 24px;color:#fff;background:var(--hero);overflow:hidden;box-shadow:0 12px 40px -12px rgba(37,99,235,.55)">
    <div style="position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 60%)"></div>
    <div style="font-size:14px;font-weight:600;opacity:.85;position:relative">Benvenuto</div>
    <div style="font-family:var(--fontr);font-weight:700;font-size:34px;letter-spacing:-.035em;line-height:1.08;margin-top:6px;position:relative">Imposta i tuoi conti</div>
    <p style="position:relative;margin:10px 0 0;opacity:.92;font-size:15px;text-wrap:pretty">Scegli il mese di partenza e scrivi quanto c'è su ogni conto. Da lì in poi i saldi si aggiornano da soli e a gennaio ripartono dal saldo finale dell'anno.</p>
  </section>
  <h2 style="font-family:var(--fontd);font-size:22px;font-weight:700;letter-spacing:-.025em;margin:28px 4px 12px">Saldi di partenza</h2>
  <div style="background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden">
    <div style="display:flex;gap:10px;align-items:center;padding:8px 10px 8px 14px;min-height:50px">
      <span style="width:30px;height:30px;border-radius:9px;background:#FF9500;color:#fff;display:grid;place-items:center;flex:none"><svg viewBox="0 0 24 24" width="17" height="17" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 6.5h16V20H4zM4 10.5h16M8.5 4v4M15.5 4v4"></path></svg></span>
      <span style="flex:1;font-weight:500">Primo mese</span>
      <input type="month" value="{{ su.ym }}" onChange="{{ su.onYM }}" style="border:0;background:none;color:var(--blue);font-weight:600;text-align:right;font-size:16px">
    </div>
    <template sc-for list="{{ su.accs }}" as="a" hint-placeholder-count="6">
      <div style="display:flex;gap:10px;align-items:center;padding:8px 10px 8px 14px;position:relative">
        <div style="position:absolute;left:54px;right:0;top:0;border-top:.5px solid var(--sep)"></div>
        <span style="width:30px;height:30px;border-radius:9px;background:{{ a.grad }};color:#fff;display:grid;place-items:center;flex:none"><svg viewBox="0 0 24 24" width="17" height="17" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M3 6h18v12H3zM3 10h18M7 14.5h4"></path></svg></span>
        <span style="flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ a.name }}</span>
        <input value="{{ a.val }}" onChange="{{ a.onChange }}" inputmode="decimal" placeholder="0,00" style="flex:0 0 112px;width:112px;text-align:right;font-family:var(--fontr);font-weight:600;background:var(--fill2);border:0;border-radius:9px;padding:7px 10px;font-size:16px;color:var(--label)">
      </div>
    </template>
  </div>
  <p style="font-size:13px;color:var(--label3);margin:10px 6px 0;line-height:1.45">Per la carta di credito scrivi un numero negativo se hai un debito. Conti e categorie si possono cambiare in Impostazioni.</p>
  <button onClick="{{ su.go }}" style="width:100%;margin-top:20px;border:0;background:var(--blue);color:#fff;border-radius:14px;padding:15px;font-weight:600;font-size:17px">Inizia</button>
</div>
</template>

<template sc-if value="{{ isApp }}" hint-placeholder-val="{{ false }}">
<div ref="{{ scrollRef }}" style="position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none">
  <header style="position:relative;z-index:2;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px">
    <div style="display:flex;align-items:center;gap:10px">
      <button onClick="{{ hd.onTitle }}" style="display:flex;align-items:baseline;gap:8px;min-width:0;margin-right:auto;border:0;background:none;padding:0;text-align:left">
        <b style="font-family:var(--fontd);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1">{{ hd.title }}</b>
        <span style="font-size:17px;color:var(--label3);font-weight:600">{{ hd.sub }}</span>
      </button>
      <template sc-if value="{{ hd.nav }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ hd.onPrev }}" aria-label="Mese precedente" style="width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;color:var(--blue);flex:none"><svg viewBox="0 0 24 24" width="18" height="18" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <button onClick="{{ hd.onNext }}" aria-label="Mese successivo" style="width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;color:var(--blue);flex:none"><svg viewBox="0 0 24 24" width="18" height="18" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="M9 5l7 7-7 7"></path></svg></button>
      </template>
    </div>
  </header>
  <div style="padding:4px 16px calc(env(safe-area-inset-bottom) + 130px)">

  <template sc-if value="{{ before }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:18px;background:var(--card);border-radius:20px;padding:30px 20px;text-align:center;color:var(--label2);box-shadow:var(--shadow)">
      <div style="font-weight:600;color:var(--label)">{{ beforeText }}</div>
      <div style="margin-top:4px">Prima di quel mese non ci sono dati.</div>
      <button onClick="{{ onStart }}" style="margin-top:14px;border:0;background:var(--fill);color:var(--blue);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px">{{ startLabel }}</button>
    </div>
  </template>

  <template sc-if value="{{ vMese }}" hint-placeholder-val="{{ false }}">
  <div style="animation:rise .35s ease-out">
    <section style="position:relative;border-radius:26px;padding:20px 20px 14px;color:#fff;background:var(--hero);overflow:hidden;margin-top:6px;box-shadow:0 12px 40px -12px rgba(37,99,235,.55)">
      <div style="position:absolute;right:-60px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 60%);pointer-events:none"></div>
      <div style="display:flex;align-items:center;gap:10px;position:relative">
        <span style="font-size:14px;font-weight:600;opacity:.85;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.label }}</span>
        <select value="{{ m.acc }}" onChange="{{ m.onAcc }}" aria-label="Conto" style="appearance:none;-webkit-appearance:none;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:16px;padding:6px 12px;font-size:13.5px;font-weight:600;max-width:52%">
          <template sc-for list="{{ accOpts }}" as="o"><option value="{{ o.v }}" style="color:#000">{{ o.l }}</option></template>
        </select>
      </div>
      <div style="font-family:var(--fontr);font-weight:700;font-size:44px;letter-spacing:-.035em;line-height:1.08;margin-top:6px;position:relative;white-space:nowrap;font-variant-numeric:tabular-nums">{{ m.value }}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;position:relative">
        <span style="display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);border-radius:14px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap">{{ m.diff }}</span>
        <template sc-if value="{{ m.hasEom }}"><span style="display:inline-flex;align-items:center;background:rgba(255,255,255,.2);border-radius:14px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap">{{ m.eom }}</span></template>
      </div>
      <div onPointerMove="{{ m.onScrub }}" onPointerDown="{{ m.onScrub }}" onPointerLeave="{{ offScrub }}" style="margin:12px -20px 0;position:relative;touch-action:pan-y;height:150px">
        <svg width="{{ W1 }}" height="150" viewBox="0 0 {{ W1 }} 150" style="display:block;overflow:visible">
          <defs><linearGradient id="hgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#fff;stop-opacity:.35"></stop><stop offset="1" style="stop-color:#fff;stop-opacity:0"></stop></linearGradient></defs>
          <path d="{{ m.hc.area }}" fill="url(#hgA)"></path>
          <path d="{{ m.hc.fcArea }}" fill="url(#hgA)" opacity=".45"></path>
          <path d="{{ m.hc.line }}" style="fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"></path>
          <path d="{{ m.hc.fcLine }}" style="fill:none;stroke:rgba(255,255,255,.75);stroke-width:2.6;stroke-dasharray:1 6;stroke-linecap:round"></path>
          <circle cx="{{ m.hc.dx }}" cy="{{ m.hc.dy }}" r="5" opacity="{{ m.hc.dotOp }}" style="fill:#fff;animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center"></circle>
          <circle cx="{{ m.hc.dx }}" cy="{{ m.hc.dy }}" r="5" opacity="{{ m.hc.dotOp }}" style="fill:#fff;stroke:rgba(255,255,255,.5);stroke-width:2.5"></circle>
          <line x1="{{ m.hc.cx }}" x2="{{ m.hc.cx }}" y1="0" y2="150" opacity="{{ m.hc.curOp }}" style="stroke:rgba(255,255,255,.6);stroke-width:1;stroke-dasharray:3 3"></line>
          <circle cx="{{ m.hc.cx }}" cy="{{ m.hc.cy }}" r="6" opacity="{{ m.hc.curOp }}" style="fill:#fff;stroke:#fff;stroke-width:3"></circle>
        </svg>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:500;padding-top:4px;opacity:.8;position:relative">
        <template sc-for list="{{ m.xl }}" as="x" hint-placeholder-count="3"><span>{{ x }}</span></template>
      </div>
      <div style="display:flex;gap:4px;margin-top:10px;position:relative">
        <template sc-for list="{{ m.ranges }}" as="r" hint-placeholder-count="4"><button onClick="{{ r.onClick }}" style="flex:1;border:0;background:{{ r.bg }};color:#fff;opacity:{{ r.op }};padding:7px 0;border-radius:12px;font-weight:600;font-size:13.5px">{{ r.l }}</button></template>
      </div>
    </section>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px">
      <template sc-for list="{{ m.tiles }}" as="t" hint-placeholder-count="3">
        <div style="background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 12px 13px;min-width:0">
          <span style="width:34px;height:34px;border-radius:10px;background:{{ t.c }};color:#fff;display:grid;place-items:center;margin-bottom:10px"><svg viewBox="0 0 24 24" width="19" height="19" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="{{ t.ic }}"></path></svg></span>
          <div style="font-size:13px;color:var(--label2);font-weight:600">{{ t.k }}</div>
          <div style="font-family:var(--fontr);font-weight:700;font-size:18px;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;color:{{ t.vc }}">{{ t.v }}</div>
          <div style="font-size:12px;color:var(--label3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.s }}</div>
        </div>
      </template>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin:28px 4px 12px">
      <h2 style="font-family:var(--fontd);font-size:22px;font-weight:700;letter-spacing:-.025em;margin:0 auto 0 0">Conti</h2>
      <button onClick="{{ m.toConti }}" style="border:0;background:none;color:var(--blue);font-weight:600;font-size:15px;padding:4px 2px">Dettagli</button>
    </div>
    <div style="display:grid;grid-auto-flow:column;grid-auto-columns:46%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -16px;padding-left:18px;padding-right:18px;scroll-padding-left:18px;scrollbar-width:none">
      <template sc-for list="{{ m.minis }}" as="a" hint-placeholder-count="3">
        <button onClick="{{ a.onClick }}" style="scroll-snap-align:start;border-radius:18px;padding:14px;color:#fff;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;position:relative;overflow:hidden;border:0;text-align:left;background:{{ a.grad }};box-shadow:{{ a.ring }}">
          <span style="position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14)"></span>
          <span style="font-size:13.5px;font-weight:600;opacity:.92;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">{{ a.name }}</span>
          <span style="font-family:var(--fontr);font-weight:700;font-size:20px;letter-spacing:-.02em;position:relative;white-space:nowrap;font-variant-numeric:tabular-nums">{{ a.bal }}</span>
        </button>
      </template>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin:22px 4px 4px">
      <h2 style="font-family:var(--fontd);font-size:22px;font-weight:700;letter-spacing:-.025em;margin:0 auto 0 0">Movimenti</h2>
      <div style="position:relative;max-width:56%;display:flex">
        <select value="{{ m.catF }}" onChange="{{ m.onCat }}" aria-label="Filtra per categoria" style="appearance:none;-webkit-appearance:none;border:0;background:var(--fill);color:var(--blue);font-weight:600;font-size:14px;border-radius:16px;padding:7px 30px 7px 13px;width:100%;text-overflow:ellipsis">
          <template sc-for list="{{ m.catOpts }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></template>
        </select>
        <svg viewBox="0 0 10 6" width="10" height="6" style="position:absolute;right:12px;top:50%;margin-top:-3px;pointer-events:none;fill:none;stroke:var(--blue);stroke-width:1.6;stroke-linecap:round"><path d="M1 1l4 4 4-4"></path></svg>
      </div>
    </div>
    <template sc-if value="{{ m.hasRows }}" hint-placeholder-val="{{ false }}">
      <div style="font-size:12px;color:var(--label3);margin:0 6px 0">Scorri una riga verso sinistra per modificarla o eliminarla.</div>
    </template>
    <template sc-for list="{{ m.days }}" as="day" hint-placeholder-count="0">
      <div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--label2);font-weight:600;padding:18px 8px 7px"><span>{{ day.label }}</span><span style="font-variant-numeric:tabular-nums;color:{{ day.netC }}">{{ day.net }}</span></div>
      <div style="background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden">
        <template sc-for list="{{ day.rows }}" as="r">
          <div style="position:relative;overflow:hidden">
            <div style="position:absolute;top:0;bottom:0;right:0;width:148px;display:flex">
              <template sc-for list="{{ r.actions }}" as="a"><button onClick="{{ a.onClick }}" style="flex:1;border:0;background:{{ a.bg }};color:#fff;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px"><svg viewBox="0 0 24 24" width="20" height="20" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="{{ a.ic }}"></path></svg>{{ a.l }}</button></template>
            </div>
            <div onPointerDown="{{ r.pd }}" onPointerMove="{{ r.pm }}" onPointerUp="{{ r.pu }}" onPointerCancel="{{ r.pu }}" style="position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);transform:{{ r.tx }};transition:{{ r.tr }};touch-action:pan-y;cursor:pointer;user-select:none">
              <template sc-if value="{{ r.sep }}"><div style="position:absolute;left:60px;right:0;top:0;border-top:.5px solid var(--sep)"></div></template>
              <span style="width:34px;height:34px;border-radius:10px;background:{{ r.c }};color:#fff;display:grid;place-items:center;flex:none;opacity:{{ r.op }}"><svg viewBox="0 0 24 24" width="19" height="19" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="{{ r.ic }}"></path></svg></span>
              <div style="flex:1;min-width:0;opacity:{{ r.op }}">
                <div style="font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.t }}<template sc-for list="{{ r.badges }}" as="b"><span style="display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px;text-transform:uppercase;background:{{ b.bg }};color:{{ b.fg }}">{{ b.t }}</span></template></div>
                <div style="font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.meta }}</div>
              </div>
              <div style="font-family:var(--fontr);font-weight:600;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;color:{{ r.ac }};text-decoration:{{ r.deco }};opacity:{{ r.op }}">{{ r.amt }}<template sc-if value="{{ r.changed }}"><small style="display:block;font-family:var(--font);font-size:11.5px;font-weight:500;color:var(--label3)">modificata</small></template></div>
            </div>
          </div>
        </template>
      </div>
    </template>
    <template sc-if value="{{ m.empty }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:12px;background:var(--card);border-radius:20px;padding:30px 20px;text-align:center;color:var(--label2);box-shadow:var(--shadow)">
        <span style="width:46px;height:46px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 auto 12px"><svg viewBox="0 0 24 24" width="24" height="24" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round"><path d="M12 5v14M5 12h14"></path></svg></span>
        <b style="color:var(--label)">{{ m.emptyT }}</b><br><span>Tocca il pulsante + per aggiungere una spesa o un'entrata.</span>
      </div>
    </template>
  </div>
  </template>

  <template sc-if value="{{ vAn }}" hint-placeholder-val="{{ false }}">
  <div style="animation:rise .35s ease-out">

    const typeSeg=()=>[['out','Uscita','var(--expf)'],['in','Entrata','var(--incf)'],['tr','Giroconto','var(--blue)']].map(([k,l,c])=>({l,bg:f.type===k?c:'transparent',fg:f.type===k?'#fff':'var(--label)',
      onClick:()=>this.patch({type:k,cat:k==='tr'?f.cat:(k==='in'?(f.cat&&f.cat.startsWith('in-')?f.cat:cfg.cats.in[0].id):(f.cat&&!f.cat.startsWith('in-')?f.cat:cfg.cats.out[0].id))})}));
    const amtC=f.type==='out'?'var(--exp)':f.type==='in'?'var(--inc)':'var(--label)';
    const accOpts=cfg.accounts.map(a=>({v:a.id,l:a.name}));
    if(f.mode==='tx'){
      Object.assign(o,{title:f.id?(f.type==='adj'?'Rettifica saldo':'Modifica movimento'):'Nuovo movimento',showSeg:f.type!=='adj',types:typeSeg(),
        amtT:(f.neg?'−':'')+(f.amt||'0'),amtC,n:f.n,onN:e=>this.patch({n:e.target.value}),showCat:f.type==='in'||f.type==='out',
        cats:(f.type==='in'?cfg.cats.in:cfg.cats.out).map(c=>{const m=this.catMeta(c.id);const on=f.cat===c.id;return {n:c.name,c:on?'rgba(255,255,255,.25)':m.color,ic:m.ic,bg:on?m.color:'var(--card)',fg:on?'#fff':'var(--label)',onClick:()=>this.patch({cat:c.id})}}),
        accRows:[{l:f.type==='tr'?'Da':'Conto',k:'acc'},...(f.type==='tr'?[{l:'Verso',k:'to'}]:[])].map(r=>({l:r.l,items:cfg.accounts.map(a=>{const on=f[r.k]===a.id;return {n:a.name,bg:on?'var(--blue)':'var(--card)',fg:on?'#fff':'var(--label)',sh:'none',onClick:()=>this.patch({[r.k]:a.id})}})})),
        dates:[['Oggi',this.TODAY],['Ieri',this.addDays(this.TODAY,-1)]].map(([l,d])=>({l,bg:f.d===d?'var(--blue)':'var(--card)',fg:f.d===d?'#fff':'var(--label)',onClick:()=>this.patch({d})})),
        d:f.d,onD:e=>e.target.value&&this.patch({d:e.target.value}),
        keys:['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>({l:k,onClick:()=>{let a=f.amt||'';
          if(k==='⌫')a=a.slice(0,-1);else if(k===','){if(!a.includes(','))a=(a||'0')+','}else{const dec=a.split(',')[1];if(dec!=null&&dec.length>=2)return;if(a.replace(',','').length>=8)return;a=a==='0'?k:a+k}
          this.patch({amt:a})}})),
        canDel:!!f.id,delL:s.armed==='deltx'?'Conferma eliminazione':'Elimina movimento',delBg:s.armed==='deltx'?'var(--expf)':'var(--card)',delC:s.armed==='deltx'?'#fff':'var(--exp)',
        onDel:()=>{if(s.armed!=='deltx')return this.setState({armed:'deltx'});this.setState({armed:null});this.delTx({id:f.id})},
        onSave:()=>{let a=this.parseAmt(f.amt);if(f.neg)a=-a;if(isNaN(a)||(f.type!=='adj'&&a<=0))return this.toast('Scrivi un importo, ad esempio 12,50');
          if(!/^\d{4}-\d{2}-\d{2}$/.test(f.d))return this.toast('Scegli una data');if(f.d.slice(0,7)<cfg.startYM)return this.toast('La data è prima di '+this.ymLabel(cfg.startYM));
          if(f.type==='tr'&&f.acc===f.to)return this.toast('Scegli due conti diversi');
          const tx={id:f.id||this.uid(),d:f.d,t:f.type,a,acc:f.acc,n:f.n.trim()};if(f.type==='tr')tx.to=f.to;else if(f.type!=='adj')tx.cat=f.cat;
          const ym=f.d.slice(0,7);this.setState(st=>({tx:[...st.tx.filter(x=>x.id!==f.id),tx],sheet:null,ym:!f.id&&ym!==st.ym?ym:st.ym}));this.toast(f.id?'Movimento aggiornato':'Movimento aggiunto')}});
    }
    if(f.mode==='rec'){
      const r=f.id?s.rec.find(x=>x.id===f.id):null;const ak='delrec';
      const save=()=>{const a=this.parseAmt(f.amt);const name=f.name.trim();const day=Math.min(31,Math.max(1,parseInt(f.day)||1));
        if(isNaN(a)||a<=0)return this.toast('Scrivi l\'importo mensile');if(!name)return this.toast('Dai un nome alla spesa fissa');if(!/^\d{4}-\d{2}$/.test(f.from))return this.toast('Scegli il primo mese');
        if(f.type==='tr'&&f.acc===f.to)return this.toast('Scegli due conti diversi');
        const n=parseInt(f.count);if(f.dur==='n'&&!(n>=1))return this.toast('Scrivi il numero di mesi');
        const it={id:f.id||this.uid(),name,a,day,t:f.type,acc:f.acc,from:f.from,until:f.dur==='n'?this.ymAdd(f.from,n-1):null};if(f.type==='tr')it.to=f.to;else it.cat=f.cat;
        this.setState(st=>({rec:[...st.rec.filter(x=>x.id!==it.id),it],sheet:null}));this.toast(f.id?'Spesa fissa aggiornata':'Spesa fissa aggiunta')};
      const setRec=(fn,msg)=>{this.setState(st=>({rec:fn(st.rec),sheet:null,armed:null}));this.toast(msg)};
      Object.assign(o,{title:r?r.name:'Nuova spesa fissa',hasRight:true,rightL:'Salva',rightC:'var(--blue)',onRight:save,types:typeSeg(),amt:f.amt,amtC,onAmt:e=>this.patch({amt:e.target.value}),
        name:f.name,onName:e=>this.patch({name:e.target.value}),showCat:f.type!=='tr',cat:f.cat,onCat:e=>this.patch({cat:e.target.value}),catOpts:(f.type==='in'?cfg.cats.in:cfg.cats.out).map(c=>({v:c.id,l:c.name})),
        day:f.day,onDay:e=>this.patch({day:e.target.value}),accL:f.type==='tr'?'Dal conto':'Conto',acc:f.acc,onAcc:e=>this.patch({acc:e.target.value}),showTo:f.type==='tr',to:f.to,onTo:e=>this.patch({to:e.target.value}),accOpts,
        from:f.from,onFrom:e=>this.patch({from:e.target.value}),dur:f.dur,onDur:e=>this.patch({dur:e.target.value}),showCount:f.dur==='n',count:f.count,onCount:e=>this.patch({count:e.target.value}),
        isEdit:!!r,closeL:this.ymLabel(s.ym).toLowerCase(),canReopen:!!(r&&r.until),
        onClose:()=>{if(s.ym<r.from)return this.toast('Scegli un mese dopo l\'inizio');setRec(L=>L.map(x=>x.id===r.id?{...x,until:s.ym}:x),'Chiusa dopo '+this.ymLabel(s.ym))},
        onReopen:()=>setRec(L=>L.map(x=>x.id===r.id?{...x,until:null}:x),'Ora è senza scadenza'),
        delL:s.armed===ak?'Conferma eliminazione':'Elimina spesa fissa',delBg:s.armed===ak?'var(--expf)':'var(--card)',delC:s.armed===ak?'#fff':'var(--exp)',
        onDel:()=>{if(s.armed!==ak)return this.setState({armed:ak});setRec(L=>L.filter(x=>x.id!==r.id),'Spesa fissa eliminata')}});
    }
    if(f.mode==='inst'){
      const r=s.rec.find(x=>x.id===f.rid);const mn=this.MESI[+f.ym.slice(5,7)-1].toLowerCase();
      const setOv=fn=>this.setState(st=>{const ov={...st.ov};const m={...(ov[f.ym]||{})};const x=fn({...(m[f.rid]||{})});if(Object.keys(x).length)m[f.rid]=x;else delete m[f.rid];ov[f.ym]=m;return {ov,sheet:null}});
      Object.assign(o,{title:r?r.name:'',hasRight:true,rightL:'Salva',rightC:'var(--blue)',
        note:`Spesa fissa di ${r?this.fmt(r.a):''} al mese, il giorno ${r?r.day:''}. Qui cambi solo ${this.ymLabel(f.ym)}.`,amtL:'Importo di '+mn,amt:f.amt,onAmt:e=>this.patch({amt:e.target.value}),
        skipL:f.skip?'Ripristina questo mese':'Salta questo mese',changed:f.changed,
        onSkip:()=>{setOv(x=>{if(x.skip)delete x.skip;else x.skip=true;return x});this.toast(f.skip?'Ripristinata':'Saltata per '+mn)},
        onReset:()=>{setOv(x=>{delete x.a;return x});this.toast('Importo standard ripristinato')},
        onEditRec:()=>r&&this.openRec(r),
        onRight:()=>{const a=this.parseAmt(f.amt);if(isNaN(a)||a<0)return this.toast('Scrivi un importo valido');setOv(x=>{if(a===r.a)delete x.a;else x.a=a;return x});this.toast('Importo di '+mn+' aggiornato')}});
    }
    if(f.mode==='adj'){
      const cur=this.balanceAt(this.TODAY,f.acc);const v=this.parseAmt(f.real);
      Object.assign(o,{title:'Allinea '+this.accName(f.acc),hasRight:true,rightL:'Allinea',rightC:'var(--blue)',cur:this.fmt(cur),real:f.real,onReal:e=>this.patch({real:e.target.value}),
        diff:isNaN(v)?'La differenza viene registrata oggi come rettifica: non conta né come spesa né come entrata.':'Differenza: '+this.fmtS(v-cur),
        onRight:()=>{if(isNaN(v))return this.toast('Scrivi il saldo reale');const d=Math.round((v-cur)*100)/100;if(!d){close();return this.toast('Il saldo è già allineato')}
          this.setState(st=>({tx:[...st.tx,{id:this.uid(),d:this.TODAY,t:'adj',a:d,acc:f.acc,n:'Rettifica saldo'}],sheet:null}));this.toast('Saldo allineato')}});
    }
    if(f.mode==='per'){
      Object.assign(o,{title:'Vai al mese',y:f.y,onYP:()=>this.patch({y:f.y-1}),onYN:()=>this.patch({y:f.y+1}),
        months:this.MB.map((l,i)=>{const ym=f.y+'-'+this.pad(i+1);const on=ym===s.ym;return {l,bg:on?'var(--blue)':'var(--card)',fg:on?'#fff':'var(--label)',sh:ym===this.CUR&&!on?'inset 0 0 0 2px var(--blue)':'none',onClick:()=>this.setState({ym,sheet:null,barSel:null})}}),
        onToday:()=>this.setState({ym:this.CUR,sheet:null,barSel:null})});
    }
    return o;
  }
}
